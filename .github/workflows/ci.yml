name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repository. Pull requests from forks get no write access to
# the GITHUB_TOKEN regardless of the repository default.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Build the library first so its dist/ type declarations exist before the
      # playground typecheck resolves `@kanushka/cell-diagram-react` via node_modules.
      - run: npm run build:lib
      - run: npm run typecheck -w @kanushka/cell-diagram-react
      - run: npm run typecheck -w @cell-architect/playground
      - run: npm test
